<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Мапа</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/game.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <meta name="theme-color" content="#0d0b09">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <script src="../assets/js/pwa.js" defer></script>

<body data-page="maps">

  <header>
    <nav>
      <a class="wf wf-link" href="game.html">Локація</a>
      <a class="wf wf-link" href="character.html">Персонаж</a>
      <a class="wf wf-link" href="maps.html" aria-current="page">Мапа</a>
      <a class="wf wf-link" href="inventory.html">Інвентар</a>
      <a class="wf wf-link" href="settings.html?from=maps">Налаштування</a>
      <a class="wf wf-link" href="../index.html">Головне меню</a>
    </nav>
  </header>

  <main>
    <div class="stack">
      <div class="panel stack">
        <div class="map-head">
          <h2>Мапа світу</h2>
          <!-- Глобальна мапа дев'яти світів — page-maps.js → showGlobeMap (дані: data/worlds.js) -->
          <button class="globe-btn" id="globe-btn" type="button" title="Мапа дев'яти світів" aria-label="Мапа дев'яти світів">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><ellipse cx="12" cy="12" rx="4.2" ry="9.2"/><path d="M3 12h18M4.6 7h14.8M4.6 17h14.8"/></svg>
          </button>
        </div>
        <!-- Картинка, зони місць і фігурка героя — game.js → pageMaps (дані мап: data/routes.js) -->
        <div class="world-map" id="world-map">
          <img class="map-img" alt="Мапа" width="2048" height="1280">
        </div>
        <p class="note" data-anchor="heading">Наведіть на місце на мапі, щоб побачити опис. Клік — обрати, подвійний клік — вирушити. Герой іде дорогами — час у дорозі видно в підказці; переміщення не скасувати.</p>
      </div>
      <div class="panel stack">
        <h2>Локації</h2>
        <div class="loc-grid" id="loc-list"></div>
      </div>
      <div class="panel stack" id="loc-details" aria-live="polite"></div>
      <a class="wf wf-link" href="game.html">Назад до локації</a>
    </div>
  </main>

  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/audio.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>

  <script src="../assets/js/save.js" defer></script>
  <script src="../assets/js/character.js" defer></script>
  <script src="../assets/js/party.js" defer></script>
  <script src="../assets/js/battle.js" defer></script>
